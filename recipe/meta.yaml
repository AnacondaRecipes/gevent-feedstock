{% set name = "gevent" %}
{% set version = "26.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 288d03addfccf0d1c67268358b6759b04392bf3bc35d26f3d9a45c82899c292d

build:
  number: 0
  skip: true  # [py<39]
  script:
    - export GEVENTSETUP_EMBED_LIBEV=0 GEVENTSETUP_EMBED_LIBUV=0 GEVENTSETUP_EMBED_CARES=0  # [unix]
    - copy %SRC_DIR%\deps\c-ares\ares_build.h.dist %SRC_DIR%\deps\c-ares\ares_build.h  # [win]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -v

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - libmagic  # [unix]
    - make  # [unix]
  host:
    - pip
    - python
    - cffi >=1.17.1
    - cython >=3.0.11
    - setuptools >=40.8.0
    - greenlet >=3.2.2
    - wheel
    - libev  # [unix]
    - libuv  # [unix]
    - c-ares  # [unix]
  run:
    - python
    - cffi >=1.17.1
    - greenlet >=3.2.2
    - zope.event
    - zope.interface
  run_constrained:
    - dnspython >=1.16.0,< 2.0  # [py<310]
    - psutil >=5.7.0  # [not win]

test:
  imports:
    - gevent
    - gevent.libev
    - gevent.libuv
    - gevent.resolver
  requires:
    - pip
  commands:
    - pip check
    # Tests fail across all platforms on CI
    # - python -m gevent.tests

about:
  home: https://www.gevent.org
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Coroutine-based network library
  description: |
    Gevent uses greenlet to provide a high-level synchronous API on top of the libev event loop.
  doc_url: https://www.gevent.org/contents.html
  dev_url: https://github.com/gevent/gevent

extra:
  recipe-maintainers:
    - nehaljwani
