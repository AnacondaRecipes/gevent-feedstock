{% set name = "gevent" %}
{% set version = "26.8.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 96039f41bbde6dcd72559e5ffbd408a04f46774b47d991d4cf032da8fa79e5a0

build:
  number: 0
  skip: true  # [py<310]
  script:
    - export GEVENTSETUP_EMBED_LIBEV=0 GEVENTSETUP_EMBED_LIBUV=0 GEVENTSETUP_EMBED_CARES=0  # [unix]
    - copy %SRC_DIR%\deps\c-ares\ares_build.h.dist %SRC_DIR%\deps\c-ares\ares_build.h  # [win]
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -v

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - libmagic  # [unix]
    - make  # [unix]
  host:
    - pip
    - python
    - cffi >=2.1.1
    - cython >=3.2.4
    - setuptools >=40.8.0
    - greenlet >=3.2.2
    - wheel
    # gevent's Unix event-loop backend - https://www.gevent.org/loop_impls.html
    - libev {{ libev }}  # [unix]
    - libuv {{ libuv }}  # [unix]
    - c-ares {{ c_ares }}  # [unix]
  run:
    - python
    - cffi >=2.1.1  # [win]
    - greenlet >=3.2.2
    - zope.event
    - zope.interface
  run_constrained:
    - dnspython >=1.16.0,< 2.0  # [py<310]
    - psutil >=6.0.0  # [not win]

test:
  imports:
    - gevent
    - gevent.libev
    - gevent.libuv
    - gevent.resolver
  requires:
    - pip
  commands:
    - pip check
    # Tests fail across all platforms on CI
    # - python -m gevent.tests

about:
  home: https://www.gevent.org
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Coroutine-based network library
  description: |
    Gevent uses greenlet to provide a high-level synchronous API on top of the libev event loop.
  doc_url: https://www.gevent.org/contents.html
  dev_url: https://github.com/gevent/gevent

extra:
  recipe-maintainers:
    - nehaljwani
